<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bot Hub</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <!-- ================= Sidebar ================= -->
  <aside class="sidebar" aria-label="Bots and navigation">
    <div class="brand">
      <span class="logo" aria-hidden="true">◆</span>
      <span>Bot Hub</span>
      <span id="mode-badge" class="badge" hidden>mock</span>
    </div>

    <nav class="nav" aria-label="Views">
      <button type="button" class="nav-item" data-view="group"># Group chat <span class="unread" data-unread="group" hidden></span></button>
      <button type="button" class="nav-item" data-view="dash">▦ Dashboard</button>
    </nav>

    <div class="side-head">
      <span>Bots</span>
      <span class="side-hint">click to chat · ☑ = in group</span>
    </div>
    <ul id="bot-list" class="bot-list"></ul>

    <div class="side-foot">
      <button id="stop-btn" type="button" class="pause" disabled>■ Pause all</button>
      <button id="theme-btn" type="button" class="ghost small" aria-label="Toggle light or dark theme">◐ Theme</button>
    </div>
  </aside>

  <!-- ================= Main ================= -->
  <div class="main">
    <header class="statusbar" aria-label="Account status">
      <div id="pills" class="pills"></div>
      <div class="status-right">
        <span id="today" class="today"></span>
        <span id="status" class="status" aria-live="polite"></span>
      </div>
    </header>

    <!-- Chat view: the group chat or a private chat with one bot -->
    <section id="view-chat" class="view chat-view" aria-label="Chat">
      <div class="view-head">
        <div class="chat-title">
          <span id="chat-avatar"></span>
          <div>
            <h1 id="chat-name">Group chat</h1>
            <div id="chat-sub" class="sub"></div>
          </div>
        </div>
        <div class="chat-actions">
          <button id="chat-usage-btn" class="ghost small" type="button" hidden>Usage ›</button>
          <button id="clear-btn" class="ghost small" type="button">Clear chat</button>
        </div>
      </div>
      <div id="chat-stats" class="chat-stats" hidden></div>
      <ol id="messages" class="messages" aria-live="polite"></ol>
      <div id="typing" class="typing" hidden></div>
    </section>

    <!-- Dashboard view -->
    <section id="view-dash" class="view dash-view" aria-label="Usage dashboard" hidden>
      <div class="view-head">
        <h1>Usage <span id="dash-scope" class="sub"></span></h1>
        <div class="seg" role="radiogroup" aria-label="Time range">
          <button type="button" data-days="1" role="radio">24h</button>
          <button type="button" data-days="7" role="radio">7d</button>
          <button type="button" data-days="30" role="radio">30d</button>
          <button type="button" data-days="all" role="radio">All</button>
        </div>
      </div>

      <div id="bot-filter" class="filter" role="radiogroup" aria-label="Show usage for"></div>

      <div id="kpis" class="kpis"></div>

      <h2 class="section">Per-bot breakdown</h2>
      <div id="bot-cards" class="bot-cards"></div>

      <div class="grid">
        <figure class="card span-2">
          <figcaption><span class="card-title">Cumulative cost by bot</span><span class="legend" data-legend="bots"></span></figcaption>
          <div id="chart-line" class="chart"></div>
        </figure>

        <figure class="card">
          <figcaption><span class="card-title">Tokens by bot</span><span id="legend-tokens" class="legend"></span></figcaption>
          <div id="chart-tokens" class="chart"></div>
        </figure>

        <figure class="card">
          <figcaption><span class="card-title">Daily cost by bot</span><span class="legend" data-legend="bots"></span></figcaption>
          <div id="chart-daily" class="chart"></div>
        </figure>

        <figure class="card">
          <figcaption><span class="card-title">When bots are busy</span><span class="legend">calls per hour, your time</span></figcaption>
          <div id="chart-heat" class="chart"></div>
        </figure>

        <figure class="card">
          <figcaption><span class="card-title">By account</span></figcaption>
          <div class="table-wrap"><table id="account-table"></table></div>
        </figure>

        <figure class="card span-2">
          <figcaption><span class="card-title">Recent calls</span></figcaption>
          <div class="table-wrap"><table id="recent-table"></table></div>
        </figure>
      </div>
      <p class="footnote">Costs are estimates from token counts and the prices in your config, and only include calls made through Bot Hub.</p>
    </section>

    <!-- Composer -->
    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="Message the group…"></textarea>
      <label class="rounds group-only" title="Each round, every selected bot replies once">Rounds
        <input id="rounds" type="number" min="1" max="10" value="1" />
      </label>
      <button id="continue-btn" class="ghost group-only" type="button" title="Let the bots keep talking without a new message">Let them talk</button>
      <button id="send-btn" type="submit" aria-label="Send">↑</button>
    </form>
  </div>
</div>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
